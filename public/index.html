<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    button {
      padding: 10px 20px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    pre {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 6px;
    }
    input {
      padding: 10px;
      width: 100%;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>🚀 My App</h1>

  <h2>DB接続確認</h2>
  <button onclick="checkHealth()">確認する</button>

  <h2>Ollamaチャット</h2>
  <input type="text" id="prompt" placeholder="質問を入力してください">
  <button onclick="sendChat()">送信</button>

  <pre id="result">結果がここに表示されます</pre>

  <script>
    async function checkHealth() {
      const res = await fetch('/api/health');
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }

    async function sendChat() {
      const prompt = document.getElementById('prompt').value;
      document.getElementById('result').textContent = '送信中...';
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      document.getElementById('result').textContent = data.response || JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
