<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#3B82F6" />
  <title>Revino — Smart review.</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <main id="screen">
      <section class="splash-screen">
        <span class="splash-deco s1">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l1.8 6.5L20 10l-6.2 1.5L12 18l-1.8-6.5L4 10l6.2-1.5L12 2z"/>
          </svg>
        </span>

        <span class="splash-deco s2">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l1.8 6.5L20 10l-6.2 1.5L12 18l-1.8-6.5L4 10l6.2-1.5L12 2z"/>
          </svg>
        </span>

        <span class="splash-deco s3">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l1.8 6.5L20 10l-6.2 1.5L12 18l-1.8-6.5L4 10l6.2-1.5L12 2z"/>
          </svg>
        </span>

        <span class="splash-deco s4">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="4"/>
          </svg>
        </span>

        <span class="splash-deco s5">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="4"/>
          </svg>
        </span>

        <span class="splash-deco s6">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="4"/>
          </svg>
        </span>

        <div class="splash-brand">
          <div class="splash-logo-mark"></div>
          <div class="splash-title">Revino</div>
          <div class="splash-tagline">
            Smart review.<br>
            <span>Stronger retention.</span>
          </div>
        </div>

        <div class="splash-illustration">
          <div class="splash-mascot">
            <div class="splash-mascot-face">
              <div class="splash-mascot-eyes">
                <span></span>
                <span></span>
              </div>
              <div class="splash-mascot-mouth"></div>
            </div>
            <div class="splash-mascot-deco"></div>
          </div>
        </div>

        <div style="width: 100%;">
          <div class="loading-bar">
            <div class="loading-fill"></div>
          </div>

          <div class="splash-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/splash.js"></script>
</body>
</html>
