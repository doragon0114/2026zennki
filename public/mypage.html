<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#3B82F6" />
  <title>Revino — マイページ</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <main id="screen">
      <!-- =========================
           マイページ画面
      ========================== -->
      <section id="mypageScreen" class="fade-in">
        <div class="mypage-hero">
          <span class="mypage-avatar" id="mypageAvatar">🐧</span>

          <div class="mypage-name" id="mypageName">読み込み中...</div>
          <div class="mypage-email" id="mypageEmail"></div>

          <div class="mypage-level-badge" id="levelBadge">Lv. 1</div>

          <div class="mypage-stats">
            <div class="mypage-stat">
              <div class="mypage-stat-num" id="pointsValue">0</div>
              <div class="mypage-stat-lbl">ポイント</div>
            </div>

            <div class="mypage-stat">
              <div class="mypage-stat-num" id="winsValue">0</div>
              <div class="mypage-stat-lbl">対戦勝利</div>
            </div>

            <div class="mypage-stat">
              <div class="mypage-stat-num" id="studiedValue">0</div>
              <div class="mypage-stat-lbl">学習回数</div>
            </div>

            <div class="mypage-stat">
              <div class="mypage-stat-num" id="questionCountValue">0</div>
              <div class="mypage-stat-lbl">問題数</div>
            </div>
          </div>
        </div>

        <div class="mypage-menu">
          <button class="static-menu-button" type="button" id="openProfileEditButton">
            <div class="mypage-menu-item">
              <div class="mypage-menu-icon blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"/>
                  <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
              </div>
              <div class="mypage-menu-label">プロフィール編集</div>
              <div class="mypage-menu-arrow">›</div>
            </div>
          </button>

          <a class="static-menu-link" href="#">
            <div class="mypage-menu-item">
              <div class="mypage-menu-icon green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 7l9-4 9 4-9 4-9-4z"/>
                  <path d="M3 12l9 4 9-4"/>
                  <path d="M3 17l9 4 9-4"/>
                </svg>
              </div>
              <div class="mypage-menu-label">セット一覧</div>
              <div class="mypage-menu-arrow">›</div>
            </div>
          </a>

          <a class="static-menu-link" href="#">
            <div class="mypage-menu-item">
              <div class="mypage-menu-icon gold">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9H4a2 2 0 0 1-2-2V5h4"/>
                  <path d="M18 9h2a2 2 0 0 0 2-2V5h-4"/>
                  <path d="M6 5h12v6a6 6 0 0 1-12 0V5z"/>
                  <path d="M9 21h6"/>
                  <path d="M12 17v4"/>
                </svg>
              </div>
              <div class="mypage-menu-label">ランキング</div>
              <div class="mypage-menu-arrow">›</div>
            </div>
          </a>

          <a class="static-menu-link" href="#">
            <div class="mypage-menu-item">
              <div class="mypage-menu-icon red">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
                  <line x1="13" y1="19" x2="19" y2="13"/>
                  <line x1="16" y1="16" x2="20" y2="20"/>
                </svg>
              </div>
              <div class="mypage-menu-label">対戦履歴</div>
              <div class="mypage-menu-arrow">›</div>
            </div>
          </a>
        </div>

        <div class="mypage-menu mypage-logout-menu">
          <button class="static-logout-button" type="button" id="logoutButton">
            <div class="mypage-menu-item danger">
              <div class="mypage-menu-icon red">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
              </div>
              <div class="mypage-menu-label">ログアウト</div>
              <div class="mypage-menu-arrow">›</div>
            </div>
          </button>
        </div>

        <div class="static-bottom-space"></div>
      </section>

      <!-- =========================
           プロフィール編集画面
           ボトムナビはJS側で非表示
      ========================== -->
      <section id="profileEditScreen" class="profile-edit-screen static-hidden">
        <div class="screen-header blue-bg">
          <button class="back-btn" type="button" id="backToMypageButton"></button>
          <div class="header-title">プロフィール編集</div>
          <div class="header-spacer"></div>
        </div>

        <div class="screen-body">
          <div class="profile-avatar-preview">
            <div id="previewAvatar">🐧</div>
          </div>

          <form id="profileForm">
            <div class="form-group">
              <label class="form-label">アバターを選択</label>
              <div class="avatar-picker" id="avatarPicker"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="editName">👤 名前</label>
              <input
                class="form-input"
                id="editName"
                type="text"
                placeholder="名前を入力"
                autocomplete="name"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="editEmail">📧 メールアドレス</label>
              <input
                class="form-input profile-email-readonly"
                id="editEmail"
                type="email"
                readonly
              />
              <p class="profile-note">メールアドレスは現在この画面では変更できません。</p>
            </div>

            <div id="profileMessage" class="alert hidden"></div>

            <button class="btn btn-primary" type="submit">💾 保存する</button>
          </form>
        </div>
      </section>
    </main>

    <!-- =========================
         ボトムナビ
    ========================== -->
    <nav id="bottomNav" class="bottom-nav">
      <a class="nav-btn" href="/home" data-screen="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
          <path d="M10 21v-6h4v6"/>
        </svg>
        <span class="nav-label">ホーム</span>
      </a>

      <a class="nav-btn" href="#" data-screen="materials">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7l9-4 9 4-9 4-9-4z"/>
          <path d="M3 12l9 4 9-4"/>
          <path d="M3 17l9 4 9-4"/>
        </svg>
        <span class="nav-label">セット</span>
      </a>

      <a class="nav-btn nav-center-btn" href="#" data-screen="upload">
        <div class="nav-center-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
      </a>

      <a class="nav-btn" href="#" data-screen="ranking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9H4a2 2 0 0 1-2-2V5h4"/>
          <path d="M18 9h2a2 2 0 0 0 2-2V5h-4"/>
          <path d="M6 5h12v6a6 6 0 0 1-12 0V5z"/>
          <path d="M9 21h6"/>
          <path d="M12 17v4"/>
        </svg>
        <span class="nav-label">ランキング</span>
      </a>

      <a class="nav-btn active" href="/mypage" data-screen="mypage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
        </svg>
        <span class="nav-label">マイページ</span>
      </a>
    </nav>
  </div>

  <script src="/js/mypage.js"></script>
</body>
</html>
